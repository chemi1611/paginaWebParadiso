<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17101c">
    <meta name="description" content="Folleto de la exposición colectiva Paradiso.">
    <title>Paradiso — Exposiciones</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="exposiciones.js" defer></script>
</head>
<body>
    <header class="encabezado">
        <a class="marca" href="index.html" aria-label="Paradiso, inicio">
            <span class="logo-marca"><img src="imagenes/logo-paradiso-club.png" alt="Logo de Paradiso Pub &amp; Club"></span>
            <span>PARADISO <small>Exposiciones</small></span>
        </a>
        <nav class="navegacion-principal" aria-label="Navegación principal">
            <a class="enlace-navegacion" href="index.html">Inicio</a>
            <a class="enlace-navegacion" href="contacto.html#contactos">Contacto</a>
            <a class="enlace-navegacion" href="ponentes.html">Ponentes</a>
        </nav>
    </header>

    <main id="inicio">
        <section class="presentacion" aria-labelledby="titulo-evento">
            <div class="presentacion-contenido">
                <p class="etiqueta-evento"><span></span> Próximo evento</p>
                <h1 id="titulo-evento">El Jardín <br><em>Sábado, 14 de Noviembre</em></h1>
                <p class="introduccion">Explora el folleto para más detalles y ver cómo participar.</p>

                <div class="selector-folleto" aria-label="Selecciona una sección del folleto" role="group">
                    <button class="boton-seccion activo" type="button" data-seccion-folleto="cartel" aria-pressed="true">Cartel</button>
                    <button class="boton-seccion" type="button" data-seccion-folleto="informacion" aria-pressed="false">Información</button>
                    <button class="boton-seccion" type="button" data-seccion-folleto="contacto" aria-pressed="false">Contacto</button>
                </div>
            </div>

            <figure class="marco-folleto">
                <button class="boton-ampliar-folleto" type="button" aria-label="Ampliar imagen del folleto">
                    <img
                        class="imagen-folleto"
                        id="imagen-folleto"
                        src="imagenes/cartel-el-jardin.jpeg"
                        alt="Folleto de la exposición colectiva Paradiso, sábado 14 de noviembre de 2026"
                        fetchpriority="high"
                    >
                </button>
                <figcaption class="pie-imagen" id="pie-imagen"></figcaption>
            </figure>
        </section>
    </main>

    <dialog class="dialogo-vista-previa" aria-label="Previsualización del folleto">
        <button class="boton-cerrar-vista-previa" type="button" aria-label="Cerrar previsualización">&times;</button>
        <img class="imagen-vista-previa" alt="">
    </dialog>

    <footer class="pie-pagina">
        <span><a href="https://www.google.com/maps/place/PARADISO+PUB+%26+CLUB/@39.4728585,-6.3798989,21z/data=!4m6!3m5!1s0xd15df90ae6b709b:0xe2d5bc9bc7a6afa2!8m2!3d39.4728408!4d-6.3800265!16s%2Fg%2F11fjzb9g2q?entry=ttu&g_ep=EgoyMDI2MTAxOS4wIKXMDSoASAFQAw%3D%3D">Dirección del Local</a></span>
        <span>
            <a href="https://www.instagram.com/magicalgoblin.photography/">@magicalgoblin.photography</a><br>
            <a href="https://www.instagram.com/sandrasanchezz__/">@sandrasanchezz</a>
        </span>
    </footer>
</body>
</html>
