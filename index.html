<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17101c">
    <meta name="description" content="Folleto de la exposición colectiva Paradiso.">
    <title>Paradiso — Exposiciones</title>
    <link rel="stylesheet" href="styleIndex.css">
    <script src="scriptIndex.js" defer></script>
</head>
<body>
    <header class="Cabezera_Principal">
        <a class="brand" href="#inicio" aria-label="Paradiso, inicio">
            <span id="logo"><img src="Imagenes/Paradiso_Logo.png" alt="Logo de Paradiso Pub &amp; Club"></span>
            <span>PARADISO <small>Exposiciones</small></span>
        </a>
    </header>

    <main id="inicio">
        <section class="showcase" aria-labelledby="page-title">
            <div class="showcase-copy">
                <p class="eyebrow"><span></span> Próximo evento</p>
                <h1 id="TextoCentral">El Jardín <br><em>Sábado, 14 de Noviembre</em></h1>
                <p class="intro">Explora el folleto para mas detalles y ver como participar.</p>

                <div class="selector" aria-label="Selecciona una sección del folleto" role="group">
                    <button class="selector-button is-active" type="button" data-flyer="cover" aria-pressed="true">Cartel</button>
                    <button class="selector-button" type="button" data-flyer="info" aria-pressed="false">Información</button>
                    <button class="selector-button" type="button" data-flyer="contact" aria-pressed="false">Contacto</button>
                </div>
            </div>

            <figure class="flyer-frame">
                <button class="flyer-preview-trigger" type="button" aria-label="Ampliar imagen del folleto">
                    <img
                        class="flyer-image"
                        id="flyer-image"
                        src="Imagenes/bf62e737-97cb-4d42-a641-f6b5519dcd39.jpeg"
                        alt="Folleto de la exposición colectiva Paradiso, sábado 14 de noviembre de 2026"
                        fetchpriority="high"
                    >
                </button>
                <figcaption class="image-caption" id="image-caption"></figcaption>
            </figure>
        </section>
    </main>

    <dialog class="preview-dialog" aria-label="Previsualización del folleto">
        <button class="preview-close" type="button" aria-label="Cerrar previsualización">&times;</button>
        <img class="preview-image" alt="">
    </dialog>

    <footer class="site-footer">
        <span>Paradiso Pub &amp; Club</span>
        <span>Una experiencia para compartir</span>
    </footer>
</body>
</html>
